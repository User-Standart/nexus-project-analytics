services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./API-5SEM-BACKEND/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./API-5SEM-BACKEND
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  etl:
    build:
      context: ./API-5SEM-ETL
    env_file:
      - .env
    volumes:
      - ./API-5SEM-ETL/data:/app/data
      - ./API-5SEM-ETL/dw:/app/dw
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./API-5SEM-FRONTEND
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PORT: "3000"
    depends_on:
      - backend

volumes:
  pgdata:
