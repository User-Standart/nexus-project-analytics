name: CI Backend

on:
  push:
    branches: [main]
    paths: ['API-5SEM-BACKEND/**', '.github/workflows/backend-ci.yml']
  pull_request:
    branches: [main]
    paths: ['API-5SEM-BACKEND/**', '.github/workflows/backend-ci.yml']

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

defaults:
  run:
    working-directory: API-5SEM-BACKEND

jobs:

  lint:
    name: Lint (Go Vet)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v5.0.1
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: API-5SEM-BACKEND/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

  test:
    name: Tests + Coverage (Go)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v5.0.1
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: API-5SEM-BACKEND/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run tests with coverage
        run: go test -v -coverprofile=coverage.out ./...

      - name: Show coverage summary
        run: go tool cover -func=coverage.out

      - name: Upload coverage report
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: coverage-report-backend
          path: API-5SEM-BACKEND/coverage.out
          retention-days: 7

  build:
    name: Build (Go)
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v5.0.1
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: API-5SEM-BACKEND/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build application
        run: go build ./...
