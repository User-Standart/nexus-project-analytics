name: CI Frontend

on:
  push:
    branches: [main]
    paths: ['API-5SEM-FRONTEND/**', '.github/workflows/frontend-ci.yml']
  pull_request:
    branches: [main]
    paths: ['API-5SEM-FRONTEND/**', '.github/workflows/frontend-ci.yml']

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_ENV: test

defaults:
  run:
    working-directory: API-5SEM-FRONTEND

jobs:

  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: API-5SEM-FRONTEND/package.json
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: API-5SEM-FRONTEND/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: API-5SEM-FRONTEND/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run ESLint
        run: pnpm lint

  typecheck:
    name: TypeScript type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: API-5SEM-FRONTEND/package.json
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: API-5SEM-FRONTEND/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: API-5SEM-FRONTEND/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Nuxt types
        run: pnpm postinstall
      - name: Run type-check
        run: pnpm typecheck

  test:
    name: Tests + Coverage (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: API-5SEM-FRONTEND/package.json
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: API-5SEM-FRONTEND/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: API-5SEM-FRONTEND/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Nuxt types
        run: pnpm postinstall
      - name: Run tests with coverage
        run: pnpm vitest run --coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: coverage-report-frontend
          path: API-5SEM-FRONTEND/coverage/
          retention-days: 7

  build:
    name: Build (Nuxt)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: API-5SEM-FRONTEND/package.json
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: API-5SEM-FRONTEND/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: API-5SEM-FRONTEND/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production
        run: pnpm build
      - name: Verify build output
        run: ls -lh .output/
