name: Deploy

# Deploys the Dockerized stack to a self-hosted Linux VM.
# Manual trigger only: register a self-hosted runner on the VM and clone this
# repository to ~/nexus-project-analytics before running it.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Update repository
        run: |
          cd ~/nexus-project-analytics
          git pull origin main

      - name: Stop containers
        run: |
          cd ~/nexus-project-analytics
          sudo docker compose down

      - name: Rebuild and start
        run: |
          cd ~/nexus-project-analytics
          sudo docker compose up -d --build

      - name: Check status
        run: |
          cd ~/nexus-project-analytics
          sudo docker compose ps
